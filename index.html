<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Гонка для двоих</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="crt"></div>

  <div id="emotes" class="hidden">
    <button data-emo="❤️">❤️</button>
    <button data-emo="😘">😘</button>
    <button data-emo="😂">😂</button>
    <button data-emo="😤">😤</button>
  </div>
  <div id="toast" class="hidden"></div>

  <!-- Главное меню -->
  <div id="menu" class="overlay">
    <div class="card">
      <h1>ГОНКА<br><span>ДЛЯ ДВОИХ</span></h1>

      <label>Имя
        <input id="nameInput" maxlength="14" placeholder="Например, Котик">
      </label>
      <div class="label">Гонщик</div>
      <div id="chars" class="chars"></div>

      <div id="trackBlock">
        <div class="label">Трасса</div>
        <div id="tracks" class="tracks"></div>
      </div>
      <p id="rotateHint" class="help hidden">Поверни телефон горизонтально</p>

      <div id="joinBlock" class="hidden">
        <p class="invite">Тебя позвали в комнату <b id="inviteCode"></b></p>
        <button id="joinInviteBtn" class="big primary">ПОЕХАЛИ!</button>
      </div>

      <div id="hostBlock">
        <button id="hostBtn" class="big primary">Создать комнату</button>
        <div class="row">
          <input id="codeInput" maxlength="6" placeholder="Код комнаты">
          <button id="joinBtn">Войти</button>
        </div>
        <button id="soloBtn">Покататься одному</button>
      </div>
      <p class="help">Стрелки / WASD — руль, газ, тормоз<br>SHIFT — нитро (канистры на трассе)<br>1–4 — смайлики</p>
    </div>
  </div>

  <!-- Лобби: соединились один раз и остаёмся в комнате -->
  <div id="lobby" class="overlay hidden">
    <div class="card wide">
      <h2>КОМНАТА <span id="roomCode"></span></h2>
      <div id="shareBlock">
        <p class="label">Отправь эту ссылку:</p>
        <div class="row">
          <input id="shareLink" readonly>
          <button id="copyBtn">Копировать</button>
        </div>
      </div>
      <div id="players" class="duo"></div>
      <div class="label">Твой гонщик</div>
      <div id="lobbyChars" class="chars small"></div>
      <div class="label">Трасса <span id="trackWho" class="who"></span></div>
      <div id="lobbyTracks" class="tracks"></div>
      <label id="lapsLabel">Кругов
        <select id="lapsSelect">
          <option>1</option><option>2</option><option selected>3</option><option>5</option>
        </select>
      </label>
      <p id="lobbyStatus" class="status"></p>
      <button id="readyBtn" class="big primary" disabled>Я ГОТОВ!</button>
      <button id="leaveBtn" class="ghost">Выйти из комнаты</button>
    </div>
  </div>

  <!-- Результаты -->
  <div id="result" class="overlay hidden">
    <div class="card">
      <h2 id="resultTitle"></h2>
      <div id="resultTable" class="players"></div>
      <p id="resultNote" class="status"></p>
      <button id="againBtn" class="big primary">ЕЩЁ РАЗ!</button>
      <button id="menuBtn" class="ghost">В меню</button>
    </div>
  </div>

  <!-- Сенсорное управление -->
  <div id="touch" class="hidden">
    <div class="tleft">
      <button id="tLeft">◀</button>
      <button id="tRight">▶</button>
    </div>
    <div class="tright">
      <button id="tNitro" class="nitro">N×0</button>
      <button id="tBrake">▼</button>
      <button id="tGas">▲</button>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/tracks.js"></script>
  <script src="js/chars.js"></script>
  <script src="js/net.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
